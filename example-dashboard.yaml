# Wellness dashboard example
# Copy the two cards to <config>/www/ and add this view to your dashboard
# (Edit dashboard → raw configuration → merge the "wellness" view).
#
# Cards need to be loaded: add a "Custom card repository" resource:
#   /local/wellness-capture-card/wellness-capture-card.js
#   /local/wellness-assign-card/wellness-assign-card.js
#   /local/wellness-meal-log-card/wellness-meal-log-card.js
# Replace `roger` with your participant slugs where relevant.

views:
  - title: Wellness
    path: wellness
    icon: mdi:heart-pulse
    cards:
      - type: custom:wellness-capture-card
        title: Meal photo

      - type: custom:wellness-assign-card
        title: Pending scale readings

      - type: custom:wellness-meal-log-card
        title: Recent meals
        limit: 10

      - type: entities
        title: Roger — calories
        entities:
          - entity: sensor.roger_today_kcal
          - entity: sensor.roger_kcal_remaining
          - entity: sensor.roger_meal_analysis_status

      - type: entities
        title: Roger — body metrics
        entities:
          - entity: number.roger_body_weight
          - entity: number.roger_waist
          - entity: button.roger_save_body_metrics
          - entity: sensor.roger_eating_regularity
          - entity: sensor.roger_last_meal

      - type: statistics-graph
        title: Weight trend
        entities:
          - sensor.roger_body_weight_statistics
        chart_type: line

      - type: statistics-graph
        title: Waist trend
        entities:
          - sensor.roger_waist_statistics
        chart_type: line

      # Recent meal photos live on the NAS mount; browse them with a
      # media-source card (media source must be configured) or show the
      # latest captured photo from your camera card's thumbnail. Example:
      # - type: media-source
      #   media_content_id: media-source://media_source/local/food-photos/roger
