save_body_metrics:
  name: Save body metrics
  description: Append the participant's current weight/waist to their body-metrics JSONL ledger (deduplicated against the last row).
  fields:
    user:
      name: User
      description: Wellness participant slug (e.g. roger).
      required: true
      example: roger
      selector:
        text:

assign_weight:
  name: Assign weight
  description: Assign a pending smart-scale reading to a participant.
  fields:
    reading_id:
      name: Reading
      description: ID of the pending scale reading (see sensor.wellness_pending attributes).
      required: true
      selector:
        text:
    user:
      name: User
      description: Wellness participant slug to assign the reading to.
      required: true
      example: roger
      selector:
        text:

dismiss_weight:
  name: Dismiss weight
  description: Discard a pending smart-scale reading (e.g. a guest stepped on the scale).
  fields:
    reading_id:
      name: Reading
      description: ID of the pending scale reading (see sensor.wellness_pending attributes).
      required: true
      selector:
        text:

analyze_meals:
  name: Analyze meals
  description: Run Groq vision on new meal photos and store food/beverage/amount/kcal analysis.
  fields:
    user:
      name: User
      description: Wellness participant slug whose unanalyzed meal photos should be processed.
      required: true
      example: roger
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of photos to analyze (default 5).
      default: 5
      selector:
        number:
          min: 1
          max: 50
          mode: box
